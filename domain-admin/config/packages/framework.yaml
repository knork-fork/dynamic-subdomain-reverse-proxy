framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false

    # Behind the reverse proxy + the bundled nginx: trust X-Forwarded-* from private
    # networks so generated URLs/redirects keep the public scheme (https) and host.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']
    handle_all_throwables: true

    session:
        enabled: true
        cookie_secure: auto
        cookie_samesite: lax

    php_errors:
        log: true

    router:
        utf8: true
