services:
  web:
    image: nginx:alpine
    network_mode: host
    env_file:
      - ./config/proxy.env
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/error-pages:/usr/share/nginx/error-pages:ro
    depends_on:
      - resolver

  resolver:
    build: ./php
    network_mode: host
    volumes:
      - ./php/resolve.php:/var/www/html/resolve.php:ro
      - ./php/www.conf:/etc/php/8.5/fpm/pool.d/www.conf:ro
      - ./config:/etc/proxy-router:ro
